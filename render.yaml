# Render Blueprint — one connected repo deploys the whole stack.
# In the Render dashboard: New → Blueprint → pick this repo. Render builds the
# Docker image, provisions a managed Postgres, wires DATABASE_URL, generates a
# strong JWT_SECRET, and prompts you for the admin/viewer passwords (sync:false).
# HTTPS is automatic. Frankfurt is Render's closest region to Nigeria.
services:
  - type: web
    name: ecews-tf-monitor
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    region: frankfurt
    plan: free            # free web spins down after ~15 min idle; use `starter` to stay warm
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ecews-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true          # Render generates a long random secret
      - key: ADMIN_PASSWORD
        sync: false                  # you set this in the dashboard on first deploy
      - key: VIEWER_PASSWORD
        sync: false
      - key: CORS_ORIGINS
        value: "*"

databases:
  - name: ecews-db
    plan: free            # free Postgres expires after 90 days; upgrade for anything lasting
    region: frankfurt
    databaseName: ecews
    user: ecews
