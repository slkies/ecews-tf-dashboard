services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ecews
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ecews}
      POSTGRES_DB: ecews
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U ecews"]
      interval: 5s
      retries: 10

  api:
    build:
      # The repo root, not ./backend: the Dockerfile builds the React app from
      # frontend/ in a first stage, and that is outside backend/.
      context: .
      dockerfile: backend/Dockerfile
      # Stamped by scripts/deploy.ps1. Unset (a bare `docker compose up
      # --build`) leaves the commit "unknown" - the version and the index hash
      # still work, so this degrades rather than breaks.
      args:
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
        GIT_DIRTY: ${GIT_DIRTY:-false}
    environment:
      DATABASE_URL: postgresql://ecews:${DB_PASSWORD:-ecews}@db:5432/ecews
      # Local compose only. APP_ENV=development is what permits an unset
      # JWT_SECRET; any other value makes the app refuse to start without one,
      # so a hosted deployment cannot silently run on a known signing key.
      APP_ENV: ${APP_ENV:-development}
      JWT_SECRET: ${JWT_SECRET:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-changeme}
    ports: ["8080:8000"]
    depends_on:
      db: {condition: service_healthy}

volumes:
  pgdata:
