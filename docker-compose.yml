services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ecews
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ecews}
      POSTGRES_DB: ecews
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U ecews"]
      interval: 5s
      retries: 10

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://ecews:${DB_PASSWORD:-ecews}@db:5432/ecews
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-changeme}
    ports: ["8080:8000"]
    depends_on:
      db: {condition: service_healthy}

volumes:
  pgdata:
