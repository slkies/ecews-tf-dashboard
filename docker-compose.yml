services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ecews
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ecews}
      POSTGRES_DB: ecews
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U ecews"]
      interval: 5s
      retries: 10

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://ecews:${DB_PASSWORD:-ecews}@db:5432/ecews
      # Local compose only. APP_ENV=development is what permits an unset
      # JWT_SECRET; any other value makes the app refuse to start without one,
      # so a hosted deployment cannot silently run on a known signing key.
      APP_ENV: ${APP_ENV:-development}
      JWT_SECRET: ${JWT_SECRET:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-changeme}
    ports: ["8080:8000"]
    depends_on:
      db: {condition: service_healthy}

volumes:
  pgdata:
