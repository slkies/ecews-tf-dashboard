name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    # The API tests exercise row-level scoping, the audit-backed lockout counter
    # and ON DELETE CASCADE. Those are database behaviours, so the suite runs
    # against a real Postgres rather than a mock.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ecews
          POSTGRES_PASSWORD: ecews
          POSTGRES_DB: ecews
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ecews"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql://ecews:ecews@localhost:5432/ecews_test
      # Lets security.py load without a production secret. The suite overrides
      # the seeded account passwords itself, so these are never real values.
      APP_ENV: development
      ADMIN_PASSWORD: admin-test-pw
      VIEWER_PASSWORD: viewer-test-pw

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Run tests
        working-directory: backend
        run: python -m pytest tests/ -q

  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Patient line lists must never enter version control. .gitignore covers
      # this, but a --force or a renamed extension would slip past it, and the
      # data is PEPFAR clinical records - worth failing the build over.
      - name: No patient data in the repository
        run: |
          hits=$(git ls-files | grep -iE '\.(xlsx|xls|parquet|parquet\.zip)$' || true)
          if [ -n "$hits" ]; then
            echo "::error::Patient data files are tracked in git:"
            echo "$hits"
            exit 1
          fi
          echo "Clean - no workbook or parquet files tracked."

      # The signing key must keep failing closed. If someone removes the guard
      # while leaving the fallback string in place, every deployment silently
      # signs tokens with a value that is in this repository.
      - name: JWT secret still fails closed
        run: |
          grep -q '_DEV_ENVS' backend/app/security.py \
            || { echo "::error::APP_ENV guard removed from security.py"; exit 1; }
          grep -q 'raise RuntimeError' backend/app/security.py \
            || { echo "::error::security.py no longer raises without JWT_SECRET"; exit 1; }
          echo "JWT secret still fails closed outside development."
